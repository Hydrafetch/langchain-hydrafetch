[project]
name = "langchain-hydrafetch"
version = "0.2.0"
description = "LangChain integration for Hydrafetch. Load, search and extract clean web data for agents and RAG."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Hydrafetch", email = "team@hydrafetch.com" }]
keywords = ["langchain", "hydrafetch", "web-scraping", "markdown", "llm", "rag", "agents", "document-loader"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["langchain-core>=1.0,<2", "hydrafetch>=0.1.1", "pydantic>=2"]

[project.urls]
Homepage = "https://hydrafetch.com"
Documentation = "https://docs.hydrafetch.com"
Source = "https://github.com/Hydrafetch/langchain-hydrafetch"
Issues = "https://github.com/Hydrafetch/langchain-hydrafetch/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_hydrafetch"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-socket>=0.7", "ruff>=0.6", "langchain-tests>=1.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
